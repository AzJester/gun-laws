name: Ingest

# Scheduled, real ingestion of firearm-related legislation + court dockets.
#
# This is SEPARATE from CI: it runs the live `npm run ingest` (not --dry-run)
# using repository secrets. It is safe to run without any secrets configured —
# the ingestion module degrades gracefully (no keys -> skipped, exit 0) — so an
# unconfigured fork won't fail this workflow.
#
# NETWORK / EGRESS: a real run needs outbound HTTPS to the provider hosts:
#   - api.legiscan.com        (LegiScan bills)
#   - v3.openstates.org       (Open States bills)
#   - www.courtlistener.com   (CourtListener dockets/opinions)
#   - api.anthropic.com       (Anthropic classifier; falls back to rules if blocked)
# GitHub-hosted runners have open egress by default. On a self-hosted or
# egress-restricted runner, add those hosts to the allowlist or the providers
# will skip with `host_not_allowed` (and the run still exits 0).
#
# DATABASE_URL must point at the production Postgres for upserts to persist;
# without it the run classifies + reports but writes nothing (exit 0).

on:
  schedule:
    # Every 6 hours (UTC). Adjust as needed.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate

      # Live ingestion. No-ops gracefully (exit 0) when secrets are absent.
      - name: Run ingestion
        working-directory: web
        run: npm run ingest
