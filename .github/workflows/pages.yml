name: Deploy static site to GitHub Pages

# Builds the FULL static public site (the read-only experience: map, every state
# page, compare, reciprocity, glossary, federal, methodology, about, changelog
# snapshot) and deploys it to GitHub Pages. This is independent of ci.yml and the
# normal server build — it runs `next build` in EXPORT mode (PAGES_EXPORT=1).
#
# The repo is a PROJECT pages site, served under the base path /gun-laws at
# https://azjester.github.io/gun-laws.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Also build/deploy from the working branch so the result can be seen
      # before merging. See the env/branch note on the deploy job below.
      - claude/practical-allen-oesuea

# Least-privilege token for Pages deploys via the official actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-progress one (a half-done
# deploy is worse than a queued one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Exclude server-only routes from the static build. `output: "export"`
      # cannot emit non-static route handlers (the API, the admin client page
      # that talks to it, and the dynamic Atom feed), so move them aside. The CI
      # checkout is ephemeral, so deleting them here never touches the repo.
      - name: Remove server-only routes (static export can't emit them)
        run: rm -rf src/app/api src/app/admin src/app/feed.xml

      # PAGES_EXPORT=1            → next.config switches to output: "export"
      # NEXT_PUBLIC_BASE_PATH     → asset/data URLs respect the /gun-laws base path
      # NEXT_PUBLIC_STATIC=1      → UI hides server-only affordances (RSS link,
      #                             subscribe form) and shows a note instead.
      # (prebuild generates public/data/* first via the npm "prebuild" hook.)
      - name: Build static export
        run: PAGES_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/gun-laws NEXT_PUBLIC_STATIC=1 npm run build

      # Pages serves with Jekyll by default, which ignores files/dirs starting
      # with "_" (e.g. Next's _next/). .nojekyll disables that.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # NOTE: the "github-pages" environment may be configured to allow deploys
    # only from the default branch. If a pre-merge deploy from
    # claude/practical-allen-oesuea is blocked here, either merge the PR to main
    # or add that branch to the environment's allowed-branches in
    # Settings → Environments → github-pages. The build job above still runs and
    # proves the export is green even when the deploy is gated.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
