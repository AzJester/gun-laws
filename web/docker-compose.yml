services:
  db:
    image: postgres:16
    container_name: gunlaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gunlaw
      POSTGRES_PASSWORD: gunlaw
      POSTGRES_DB: gunlaw
    ports:
      - "5432:5432"
    volumes:
      - gunlaw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gunlaw -d gunlaw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gunlaw_pgdata:
